<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funko Store</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sigmar+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="header_logged_in.css">
</head>
<body>
<header>
    <section class="logo-title-list">
        <figure>
            <img src="images/logo.png" alt="logo de la empresa" class="logo">
        </figure>
        <h1 class="sigmar-one-regular" id="title">Funko Store</h1>
    </section>

    <form class="search-container">
        <button type="button" class="filter-button">
            <img src="images/filter.png" alt="Filtrar" class="filter-icon">
        </button>
        <label>
            <input type="search" placeholder="Buscar...">
        </label>
        <button type="submit" class="search-button">
            <img src="images/search.png" alt="Buscar" class="search-icon">
        </button>
    </form>

    <section class="logged-in-options-container">
        <button class="cart-button">
            <img src="images/shopping-cart.png" alt="Carrito" class="cart-icon">
        </button>
        <button class="log-out-button">
            <img src="images/log-out.png" alt="Cerrar sesión" class="log-out-icon">
        </button>
    </section>
</header>
</body>
</html>
