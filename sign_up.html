<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sigmar+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="header_logged_out.css">
  <link rel="stylesheet" href="footer.css">
  <link rel="stylesheet" href="login_page.css">

  <script src="xlu-include-file.js"></script>
</head>
<body>
  <header xlu-include-file="header_logged_out.html"></header>
  <main>
    <article id="register_box">
      <h1 id="register_text">Register</h1>
      <form id="input_form">
        <input type="text" placeholder="Name*" name="name" />
        <input type="text" placeholder="Surname*" name="surname" />
        <input type="text" placeholder="Email*" name="email" />
        <input type="text" placeholder="Password*" name="password" />
        <button type="submit" id="submit_button">Submit</button>
      </form>
    </article>
  </main>
  <footer xlu-include-file="footer.html"></footer>
  <script>xLuIncludeFile()</script>
</body>
</html>
