<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sigmar+One&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="header_logged_out.css">
    
    </head>

    <main>
        <header>
            <ul class="logo-title-list">
                <li><figure>
                    <img src="images/logo.png" alt="logo de la empresa" class="logo">
                </figure></li>
                <li><h1 class="sigmar-one-regular" id="title"> Funko Store</h1></li>
            </ul>
            <form class="search-container">
                <label>
                    <input type="search" placeholder="Buscar...">
                </label>
                <button type="submit" class="search-button">
                    <img src="images/search.png" alt="buscar" class="search-icon">
                </button>
            </form>
            <ul class="button-list">
                <li><button class="button" id="sign_up">Sign up</button></li>
                <li><button class="button" id="sign_in">Sign in</button></li>
            </ul>
        </header>
    </main>
</html>
