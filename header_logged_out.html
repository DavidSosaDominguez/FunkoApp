<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sigmar+One&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="header_logged_out.css">

    </head>

    <main>
        <header>
            <section class="logo-title-list">
                <figure>
                    <img src="images/logo.png" alt="logo de la empresa" class="logo">
                </figure>
                <h1 class="sigmar-one-regular" id="title"> Funko Store</h1>
            </section>
            <form class="search-container">
                <button type="button" class="filter-button">
                    <img src="images/filter.png" alt="Filtrar" class="filter-icon">
                </button>
                <label>
                    <input type="search" placeholder="Buscar...">
                </label>
                <button type="submit" class="search-button">
                    <img src="images/search.png" alt="buscar" class="search-icon">
                </button>
            </form>
            <section class="button-list">
                <button class="button" id="sign_up">Sign up</button>
                <button class="button" id="sign_in">Sign in</button>
            </section>
        </header>
    </main>
</html>
