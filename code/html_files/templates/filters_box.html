<section id="filters-modal" class="modal">
    <section class="modal-content">
        <span class="close">&times;</span>
        <form class="filter-box" id="filterMenu">
            <fieldset>
                <legend>Collection</legend>
                <label><input type="checkbox" name="size" value="Invincible" checked> Invincible</label>
                <label><input type="checkbox" name="size" value="LOL" checked> LOL</label>
                <label><input type="checkbox" name="size" value="HARRY-POTTER" checked> Harry-Potter</label>
                <label><input type="checkbox" name="size" value="STAR-WARS" checked> Star-Wars</label>
            </fieldset>
            <fieldset class="price-range">
                <legend>Price Range</legend>
                <section class="range-container">
                    <label for="price" class="min-price">0 €</label>
                    <input type="range" id="price" name="price" min="0" max="100" value="100" oninput="updatePriceValue(this.value)">
                    <label for="price" class="max-price">100 €</label>
                </section>
                <span id="price-value">100 €</span>
            </fieldset>
        </form>
    </section>
</section>
