<!DOCTYPE html>
<!--suppress ALL -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sigmar+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../stylesheets/styles.css">
  <link rel="stylesheet" href="../../stylesheets/header.css">
  <link rel="stylesheet" href="../../stylesheets/footer.css">
  <link rel="stylesheet" href="../../stylesheets/sign_in_and_sign_up_page.css">
  <link rel="stylesheet" href="../../stylesheets/filters_box.css">

  <script src="../../scripts/xlu-include-file.js"></script>
</head>
<body>
  <header xlu-include-file="../templates/new_header.html"></header>
  <main>
    <section id="popup-container"></section>
    <article id="register_box">
      <h1 id="register_text">Sign Up</h1>
      <form class="input_form" id="signup_form">
        <input id="name" type="text" placeholder="Name*" name="name" pattern="[a-zA-Z]+" required title="Insert your name (only alphabetic characters)"/>
        <input id="surname" type="text" placeholder="Surname*" name="surname" pattern="[a-zA-Z]+" required title="Insert your surname (only alphabetic characters)"/>
        <input id="email" type="email" placeholder="Email*" name="email" required/>
        <input id="password" type="password" placeholder="Password*" name="password" minlength="8" required/>
        <button type="submit" id="submit_button">Submit</button>
      </form>
    </article>
  </main>
  <footer xlu-include-file="../templates/footer_template.html"></footer>
  <script>xLuIncludeFile()</script>
  <script src="../../scripts/user_signup.js"></script>
  <script src="../../scripts/get-product-list-data.js"></script>
  <script src="../../scripts/filters-box-handler.js"></script>
</body>
</html>
