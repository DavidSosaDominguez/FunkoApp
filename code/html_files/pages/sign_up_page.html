<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sigmar+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../stylesheets/styles.css">
  <link rel="stylesheet" href="../../stylesheets/header_logged_out.css">
  <link rel="stylesheet" href="../../stylesheets/footer.css">
  <link rel="stylesheet" href="../../stylesheets/login_page.css">

  <script src="../../scripts/xlu-include-file.js"></script>
</head>
<body>
  <header xlu-include-file="../templates/no_log_header_template.html"></header>
  <main>
    <article id="register_box">
      <h1 id="register_text">Sign Up</h1>
      <form id="input_form">
        <input type="text" placeholder="Name*" name="name" />
        <input type="text" placeholder="Surname*" name="surname" />
        <input type="text" placeholder="Email*" name="email" />
        <input type="text" placeholder="Password*" name="password" />
        <button type="submit" id="submit_button">Submit</button>
      </form>
    </article>
  </main>
  <footer xlu-include-file="../templates/footer_template.html"></footer>
  <script>xLuIncludeFile()</script>
</body>
</html>
