<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sigmar+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../stylesheets/styles.css">
  <link rel="stylesheet" href="../../stylesheets/header.css">
  <link rel="stylesheet" href="../../stylesheets/footer.css">
  <link rel="stylesheet" href="../../stylesheets/sign_in_and_sign_up_page.css">

  <script src="../../scripts/xlu-include-file.js"></script>
</head>
<body>
<header xlu-include-file="../templates/new_header.html"></header>
<main>
  <article id="register_box">
    <h1 id="register_text">Sign In</h1>
    <form class="input_form" id="login_form">
      <input id="email" type="email" placeholder="Email*" name="email" required/>
      <input id="password" type="password" placeholder="Password*" name="password" required minlength="8"/>
      <button type="submit" id="submit_button">Submit</button>
    </form>
  </article>
  <section id="register_link">
    <button type="button" id="signup_link">
      <a href="sign_up_page.html">New to the shop? Register here</a>
    </button>
  </section>
</main>
<footer xlu-include-file="../templates/footer_template.html"></footer>
<script>xLuIncludeFile()</script>
<script src="../../scripts/user_login.js"></script>
<script src="../../scripts/get-product-list-data.js"></script>
</body>
</html>
