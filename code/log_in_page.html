<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sigmar+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="header_logged_out.css">
  <link rel="stylesheet" href="footer.css">
  <link rel="stylesheet" href="login_page.css">

  <script src="xlu-include-file.js"></script>
</head>
<body>
<header xlu-include-file="no_log_header_template.html"></header>
<main>
  <article id="register_box">
    <h1 id="register_text">Log In</h1>
    <form id="input_form">
      <input type="text" placeholder="Email*" name="email" />
      <input type="text" placeholder="Password*" name="password" />
      <button type="submit" id="submit_button">Submit</button>
    </form>
  </article>
  <section id="register_link">
    <button type="button" id="signup_link">
      <a href="sign_up_page.html">New to the shop? Register here</a>
    </button>
  </section>
</main>
<footer xlu-include-file="footer_template.html"></footer>
<script>xLuIncludeFile()</script>
</body>
</html>
