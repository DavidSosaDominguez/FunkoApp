<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilterBox</title>
    <link rel="stylesheet" href="stylesheets/filters_box.css">
</head>
<body>
<form class="filter-box">
    <fieldset>
        <legend>Collection</legend>
        <label><input type="checkbox" name="size" value="Invincible" checked> Invincible</label>
        <label><input type="checkbox" name="size" value="LOL" checked> LOL</label>
        <label><input type="checkbox" name="size" value="3rd" checked> 3rd</label>
        <label><input type="checkbox" name="size" value="4th" checked> 4th</label>
    </fieldset>
    <fieldset class="price-range">
        <legend>Price Range</legend>
        <section class="range-container">
            <label for="price" class="min-price">0 €</label>
            <input type="range" id="price" name="price" min="0" max="100" value="10" oninput="updatePriceValue(this.value)">
            <label for="price" class="max-price">100 €</label>
        </section>
        <span id="price-value">100 €</span>
    </fieldset>
</form>

<script>
    function updatePriceValue(value) {
        document.getElementById('price-value').innerText = value + ' €';
    }
</script>
</body>
</html>
